# Exact host — must beat the *.internal.vatengi.com wildcard that points elsewhere.
server {
    listen 80;
    listen [::]:80;
    server_name admin2.internal.vatengi.com demo2.internal.vatengi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin2.internal.vatengi.com demo2.internal.vatengi.com;

    root /dpool/tracepharma/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/internal.vatengi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internal.vatengi.com/privkey.pem;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
