name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'release/**'

jobs:
  lint-analyse-unit:
    name: Pint + PHPStan + Unit
    runs-on: ubuntu-latest

    # Feature receiving (and many Unit tests that initialize demo2) need the
    # internal.vatengi.com tenant DB (e.g. tenant_demo2_internal_vatengi_com).
    # Those suites run on internal runners — not GitHub Actions without secrets.
    # This job covers static checks + Unit tests that use the synthetic
    # phpunit.xml MySQL (tracepharma_test). Demo2-dependent Unit tests may be
    # skipped/failed here; treat internal runner Feature+demo2 Unit as source of truth.

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tracepharma_test
          MYSQL_USER: tracepharma
          MYSQL_PASSWORD: tracepharma
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (lint)
        run: composer lint

      - name: PHPStan (allowlist / analyse, not analyse:full)
        run: composer analyse

      - name: Prepare central test database
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tracepharma_test
          DB_USERNAME: tracepharma
          DB_PASSWORD: tracepharma
          DB_SOCKET: ''
        run: |
          # phpunit.xml also sets DB_SOCKET to a host path; clear for GHA TCP MySQL.
          php artisan config:clear --ansi
          php artisan migrate:fresh --force --env=testing --ansi

      - name: Unit tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tracepharma_test
          DB_USERNAME: tracepharma
          DB_PASSWORD: tracepharma
          DB_SOCKET: ''
        run: php artisan test --compact tests/Unit
