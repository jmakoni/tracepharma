; Laravel Horizon for /dpool/tracepharma (demo2.internal.vatengi.com workspace).
; Uses isolated REDIS_PREFIX / HORIZON_PREFIX so jobs never mix with prod/stage.
;
; Install:
;   sudo cp scripts/deploy/supervisor/tracepharma-dpool-horizon.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start tracepharma-dpool-horizon

[program:tracepharma-dpool-horizon]
process_name=%(program_name)s
command=/usr/bin/php /dpool/tracepharma/artisan horizon
directory=/dpool/tracepharma
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tracepharma-dpool-horizon.log
stopwaitsecs=3660
